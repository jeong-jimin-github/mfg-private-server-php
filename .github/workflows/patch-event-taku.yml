name: Patch event table parity

on:
  push:
    paths:
      - '.github/workflows/patch-event-taku.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Apply event table parity patch
        run: python3 tools/apply_event_taku_patch.py
      - name: Verify focused tests
        run: |
          php -l src/Aog/Dispatcher.php
          php -l tests/event_flags_test.php
          php tests/event_flags_test.php
          php tests/aog_routes_test.php
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Aog/Dispatcher.php tests/event_flags_test.php
          git commit -m 'Match original event table flag budget'
          git pull --rebase origin main
          git push
