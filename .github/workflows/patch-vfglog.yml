name: Patch vfglog client diagnostics

on:
  push:
    paths:
      - '.github/workflows/patch-vfglog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply vfglog parity patch
        run: python3 tools/apply_vfglog_patch.py
      - name: Verify focused tests
        run: |
          php -l src/Eamuse/Dispatcher.php
          php -l tests/vfglog_test.php
          php tests/vfglog_test.php
          php tests/cardmng_eacoin_test.php
          php tests/eamuse_bootstrap_test.php
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Eamuse/Dispatcher.php tests/vfglog_test.php
          git commit -m 'Implement vfglog client diagnostics'
          git push

# retry: 2
