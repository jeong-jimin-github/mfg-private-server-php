name: One-shot iwinv deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '.deploy/**'

permissions:
  contents: read

env:
  DEPLOY_PAYLOAD_PATH: .deploy/iwinv.enc

jobs:
  deploy:
    if: github.actor == 'jeong-jimin-github'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Prepare one-shot key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/iwinv-deploy-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/iwinv-deploy-private.pem -pubout -out /tmp/iwinv-deploy-public.pem >/dev/null 2>&1

      - name: Upload one-shot public key
        uses: actions/upload-artifact@v4
        with:
          name: iwinv-deploy-public-key
          path: /tmp/iwinv-deploy-public.pem
          retention-days: 1

      - name: Wait for encrypted deployment payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/contents/${DEPLOY_PAYLOAD_PATH}?ref=${REF}"
          found=0
          for i in $(seq 1 90); do
            code=$(curl -L -sS -o /tmp/payload-meta.json -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" || true)
            if [ "$code" = "200" ]; then
              jq -r '.content' /tmp/payload-meta.json | tr -d '\n' | base64 -d > /tmp/iwinv.enc
              found=1
              break
            fi
            sleep 3
          done
          [ "$found" = "1" ] || { echo 'Encrypted deployment payload was not supplied in time.' >&2; exit 1; }
          openssl pkeyutl -decrypt -inkey /tmp/iwinv-deploy-private.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/iwinv.enc -out /tmp/iwinv.json
          chmod 600 /tmp/iwinv.json
          jq -e '.ftp_host and .ftp_user and .ftp_pass' /tmp/iwinv.json >/dev/null

      - name: Prepare shared-hosting config
        shell: bash
        run: |
          set -euo pipefail
          db_dsn=$(jq -r '.db_dsn // empty' /tmp/iwinv.json)
          db_user=$(jq -r '.db_user // empty' /tmp/iwinv.json)
          db_pass=$(jq -r '.db_pass // empty' /tmp/iwinv.json)
          if [ -n "$db_dsn" ]; then
            DB_DSN="$db_dsn" DB_USER="$db_user" DB_PASS="$db_pass" php -r '
              $q=static fn(string $v): string => var_export($v,true);
              file_put_contents("config.local.php", "<?php\nreturn [\n    \'db_dsn\' => ".$q(getenv("DB_DSN")).",\n    \'db_user\' => ".$q(getenv("DB_USER")).",\n    \'db_pass\' => ".$q(getenv("DB_PASS")).",\n];\n");
            '
          else
            cat > config.local.php <<'PHP'
          <?php
          return [
              'db_dsn' => 'sqlite:' . __DIR__ . '/data/mfg.sqlite',
              'db_user' => '',
              'db_pass' => '',
          ];
          PHP
          fi

      - name: Upload safely to public_html
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          host=$(jq -r '.ftp_host' /tmp/iwinv.json)
          user=$(jq -r '.ftp_user' /tmp/iwinv.json)
          pass=$(jq -r '.ftp_pass' /tmp/iwinv.json)
          remote=$(jq -r '.remote_dir // "public_html"' /tmp/iwinv.json)
          [ -n "$remote" ] || remote=public_html
          echo "Deploying safely to FTP directory: $remote"

          cat > /tmp/deploy.lftp <<EOF
          set ftp:ssl-allow false
          set net:max-retries 2
          set net:timeout 20
          set mirror:parallel-transfer-count 4
          open -u "$user","$pass" "ftp://$host"
          cd "$remote"
          mirror -R --ignore-time --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .deploy/ \
            --exclude-glob tests/ \
            --exclude-glob tools/ \
            --exclude-glob '*.sqlite' \
            --exclude-glob '.gitignore' \
            --exclude-glob 'README.md' \
            ./ ./
          bye
          EOF
          lftp -f /tmp/deploy.lftp

      - name: Verify site
        shell: bash
        run: |
          set -euo pipefail
          site=$(jq -r '.site_url // "https://jm0730.iwinv.net/"' /tmp/iwinv.json)
          ok=0
          for path in health healthz /; do
            url="${site%/}/${path#/}"
            code=$(curl -k -L -sS -o /tmp/site-body -w '%{http_code}' --max-time 20 "$url" || true)
            echo "$url -> HTTP $code"
            head -c 500 /tmp/site-body || true
            echo
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ] 2>/dev/null; then ok=1; break; fi
          done
          [ "$ok" = "1" ] || { echo 'Site verification failed.' >&2; exit 1; }

      - name: Destroy one-shot private key
        if: always()
        shell: bash
        run: |
          rm -f /tmp/iwinv-deploy-private.pem /tmp/iwinv-deploy-public.pem /tmp/iwinv.json /tmp/iwinv.enc /tmp/deploy.lftp
