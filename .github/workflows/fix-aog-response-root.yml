name: Fix AOG response root

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite AOG XML wrappers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('src/Aog/Dispatcher.php'),
              Path('src/Aog/FeatureDispatcher.php'),
              Path('src/Aog/MiscDispatcher.php'),
          ]
          old = "return '<?xml version=\"1.0\" encoding=\"UTF-8\"?><response>'.$inner.'</response>';"
          new = "return '<?xml version=\"1.0\" encoding=\"UTF-8\"?><root><serv_st><code>0</code></serv_st>'.$inner.'</root>';"
          for p in files:
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'wrapper not found in {p}')
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Aog/Dispatcher.php src/Aog/FeatureDispatcher.php src/Aog/MiscDispatcher.php
          git diff --cached --quiet && exit 0
          git commit -m 'Match original AOG root and serv_st contract'
          git push
