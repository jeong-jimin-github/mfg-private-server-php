name: PHP regression tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, simplexml, pdo_sqlite, mbstring
      - name: Syntax check
        run: find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: SQLite database
        run: php tests/database_test.php
      - name: Protocol
        run: php tests/protocol_test.php
      - name: KBin
        run: php tests/kbin_test.php
      - name: Mahjong core
        run: php tests/mahjong_test.php
      - name: Score math
        run: php tests/score_math_test.php
      - name: Hand evaluator
        run: php tests/hand_evaluator_test.php
      - name: Situational yaku
        run: php tests/situational_yaku_test.php
      - name: Result XML
        run: php tests/result_xml_test.php
      - name: Round settlement
        run: php tests/round_settlement_test.php
      - name: Integrated table rules
        run: php tests/table_rules_integration_test.php
      - name: Rob kakan
        run: php tests/chankan_test.php
      - name: Kyuushu
        run: php tests/kyuushu_test.php
      - name: TSUMOCHOICES parity
        run: php tests/tsumo_choices_test.php
      - name: CPU AI
        run: php tests/cpu_ai_test.php
      - name: Live Table CPU AI
        run: php tests/table_cpu_integration_test.php
      - name: Multi ron
        run: php tests/multi_ron_test.php
      - name: Gacha pools
        run: php tests/gacha_pools_test.php
      - name: Match stream
        run: php tests/match_test.php
      - name: Calls and wins
        run: php tests/calls_test.php
      - name: Features
        run: php tests/features_test.php
      - name: Misc AOG
        run: php tests/misc_test.php
      - name: All AOG routes
        run: php tests/aog_routes_test.php

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mfg
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - name: MySQL database
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=mfg;charset=utf8mb4
          TEST_DB_USER: root
          TEST_DB_PASS: root
        run: php tests/database_test.php
