name: Patch vfglog client diagnostics

on:
  push:
    paths:
      - '.github/workflows/patch-vfglog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply vfglog parity patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/Eamuse/Dispatcher.php')
          s=p.read_text()
          old="$module === 'vfglog' => $this->wrap('vfglog', ''),"
          new="$module === 'vfglog' => $this->vfglog($method, $root),"
          if old not in s: raise SystemExit('vfglog dispatch anchor missing')
          s=s.replace(old,new,1)
          anchor="""    private function findModuleNode(?SimpleXMLElement $root, string $name): ?SimpleXMLElement
"""
          method=r'''    private function vfglog(string $method, ?SimpleXMLElement $root): string
    {
        if ($method === 'put_msg' && $root) {
            $nodes = $root->xpath('//msg') ?: [];
            foreach ($nodes as $msg) {
                $label = trim((string)($msg['label'] ?? '?'));
                if ($label === '') $label = '?';
                $value = trim((string)$msg);
                if (strlen($value) > 500) $value = substr($value, 0, 500);
                if ($label === 'network_error') {
                    error_log('[MFG][client][ERROR] network_error: ' . $value);
                } else {
                    error_log('[MFG][client] ' . $label . ': ' . $value);
                }
            }
        }
        return $this->wrap('vfglog', '');
    }

'''
          if anchor not in s: raise SystemExit('vfglog insertion anchor missing')
          s=s.replace(anchor,method+anchor,1)
          p.write_text(s)

          test=Path('tests/vfglog_test.php')
          test.write_text(r'''<?php

declare(strict_types=1);

spl_autoload_register(static function(string $class):void{
    $p='Mfg\\';if(!str_starts_with($class,$p))return;$r=substr($class,strlen($p));require __DIR__.'/../src/'.str_replace('\\','/',$r).'.php';
});

use Mfg\Eamuse\Dispatcher;
use Mfg\Storage\Database;

function vl_ok(bool $v,string $m):void{if(!$v)throw new RuntimeException($m);}

$tmp=tempnam(sys_get_temp_dir(),'mfg-vfglog-');
vl_ok($tmp!==false,'temp log');
$old=ini_get('error_log');ini_set('error_log',$tmp);
try{
    $db=new Database('sqlite::memory:');$d=new Dispatcher($db,'http://127.0.0.1:8080');
    $xml='<call model="VFG:J:A:A:2025122300"><vfglog method="put_msg">'
        .'<loc_id __type="str">VFG00001</loc_id>'
        .'<msg __type="str" label="network_error">2026-08-30 20:00:00,GetMenuData,630,A1DD6D1B6F9BF4E1,,parse failed</msg>'
        .'<msg __type="str" label="storage_info">{&quot;Items&quot;:[]}</msg>'
        .'</vfglog></call>';
    $res=$d->dispatch('VFG:J:A:A:2025122300','vfglog','put_msg',new SimpleXMLElement($xml));
    $root=new SimpleXMLElement($res);vl_ok(isset($root->vfglog),'response node');vl_ok((string)$root->vfglog['status']==='0','response status');
    $log=file_get_contents($tmp)?:'';
    vl_ok(str_contains($log,'network_error'),'network error missing');
    vl_ok(str_contains($log,'GetMenuData'),'request type missing');
    vl_ok(str_contains($log,'[MFG][client] storage_info:'),'normal client log missing');

    // Unknown vfglog methods remain harmless success stubs.
    $res=$d->dispatch('VFG:J:A:A:2025122300','vfglog','unknown',new SimpleXMLElement('<call><vfglog method="unknown"/></call>'));
    $root=new SimpleXMLElement($res);vl_ok((string)$root->vfglog['status']==='0','unknown method status');
}finally{
    ini_set('error_log',(string)$old);@unlink($tmp);
}

echo "vfglog diagnostics OK\n";
''')

          wf=Path('.github/workflows/php-tests.yml')
          s=wf.read_text()
          anchor="""      - name: e-Amusement bootstrap parity
        run: php tests/eamuse_bootstrap_test.php
"""
          add=anchor+"""      - name: vfglog diagnostics
        run: php tests/vfglog_test.php
"""
          if anchor not in s: raise SystemExit('workflow anchor missing')
          if 'php tests/vfglog_test.php' not in s: s=s.replace(anchor,add,1)
          wf.write_text(s)
          PY
      - name: Verify focused tests
        run: |
          php -l src/Eamuse/Dispatcher.php
          php -l tests/vfglog_test.php
          php tests/vfglog_test.php
          php tests/cardmng_eacoin_test.php
          php tests/eamuse_bootstrap_test.php
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Eamuse/Dispatcher.php tests/vfglog_test.php .github/workflows/php-tests.yml
          git commit -m 'Implement vfglog client diagnostics'
          git push
