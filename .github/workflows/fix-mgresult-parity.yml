name: Fix mgresult parity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mgresult parity patch
        run: python3 tools/fix_mgresult_parity.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Aog/Dispatcher.php
          git diff --cached --quiet && exit 0
          git commit -m 'Match original end_game mgresult contract'
          git pull --rebase origin main
          git push
