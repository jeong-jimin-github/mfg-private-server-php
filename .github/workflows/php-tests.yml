name: PHP regression tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, simplexml, pdo_sqlite, mbstring
      - name: Syntax check
        run: find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: SQLite database
        run: php tests/database_test.php
      - name: Protocol
        run: php tests/protocol_test.php
      - name: KBin
        run: php tests/kbin_test.php
      - name: App RC4/LZ77/KBin E2E
        run: php tests/app_transport_e2e_test.php
      - name: Health endpoints
        run: php tests/health_test.php
      - name: Cardmng and eacoin parity
        run: php tests/cardmng_eacoin_test.php
      - name: e-Amusement bootstrap parity
        run: php tests/eamuse_bootstrap_test.php
      - name: vfglog diagnostics
        run: php tests/vfglog_test.php
      - name: GetMenuData parser contract
        run: php tests/menu_contract_test.php
      - name: AOG boot and matching parity
        run: php tests/aog_match_contract_test.php
      - name: Event table flags
        run: php tests/event_flags_test.php
      - name: end_game mgresult parity
        run: php tests/mgresult_contract_test.php
      - name: Mahjong core
        run: php tests/mahjong_test.php
      - name: Score math
        run: php tests/score_math_test.php
      - name: Hand evaluator
        run: php tests/hand_evaluator_test.php
      - name: Situational yaku
        run: php tests/situational_yaku_test.php
      - name: Result XML
        run: php tests/result_xml_test.php
      - name: Round settlement
        run: php tests/round_settlement_test.php
      - name: Integrated table rules
        run: php tests/table_rules_integration_test.php
      - name: Rob kakan
        run: php tests/chankan_test.php
      - name: Kyuushu
        run: php tests/kyuushu_test.php
      - name: TSUMOCHOICES parity
        run: php tests/tsumo_choices_test.php
      - name: CPU AI
        run: php tests/cpu_ai_test.php
      - name: Live Table CPU AI
        run: php tests/table_cpu_integration_test.php
      - name: Multi ron
        run: php tests/multi_ron_test.php
      - name: Gacha pools
        run: php tests/gacha_pools_test.php
      - name: Match stream
        run: php tests/match_test.php
      - name: Full match E2E
        run: php tests/match_e2e_test.php
      - name: Calls and wins
        run: php tests/calls_test.php
      - name: Features
        run: php tests/features_test.php
      - name: Misc AOG
        run: php tests/misc_test.php
      - name: All AOG routes
        run: php tests/aog_routes_test.php

  http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, simplexml, pdo_sqlite, mbstring
      - name: Real HTTP RC4/LZ77/KBin/AOG integration
        env:
          DB_DSN: sqlite:/tmp/mfg-http.sqlite
          VFG_CARDMNG_MODE: strict
          TEST_BASE_URL: http://127.0.0.1:18080
        run: |
          rm -f /tmp/mfg-http.sqlite /tmp/mfg-http.sqlite-wal /tmp/mfg-http.sqlite-shm
          php -S 127.0.0.1:18080 -t public public/index.php >/tmp/mfg-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 0.25
          done
          php tests/http_transport_client.php

  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, simplexml, pdo_sqlite, mbstring
      - name: All 23 game modes soak
        run: php tests/all_modes_soak_test.php
      - name: Multi-seed representative soak
        run: |
          for seed in 0x61000000 0x62000000 0x63000000; do
            SOAK_MODES=1,3,4,6,20,23 SOAK_SEED_BASE="$seed" php tests/all_modes_soak_test.php
          done

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mfg
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, simplexml
      - name: MySQL database
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=mfg;charset=utf8mb4
          TEST_DB_USER: root
          TEST_DB_PASS: root
        run: php tests/database_test.php
      - name: MySQL cross-request AOG persistence
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=mfg;charset=utf8mb4
          TEST_DB_USER: root
          TEST_DB_PASS: root
        run: php tests/mysql_request_persistence_test.php
