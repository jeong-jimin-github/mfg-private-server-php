name: Patch situational-only yaku

on:
  push:
    paths:
      - '.github/workflows/patch-situational-yaku.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply parity fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/Mahjong/HandEvaluator.php')
          s=p.read_text()
          old="""        array $uraIndicators,
                  int $taku
              ): ?array {"""
          new="""        array $uraIndicators,
                  int $taku,
                  bool $allowNoYaku = false
              ): ?array {"""
          if old not in s:
              raise SystemExit('HandEvaluator signature anchor missing')
          s=s.replace(old,new,1)
          old2="if($han<=0 && $yakuman<=0)continue;"
          if old2 not in s:
              raise SystemExit('HandEvaluator yaku gate anchor missing')
          s=s.replace(old2,"if(!$allowNoYaku && $han<=0 && $yakuman<=0)continue;",1)
          p.write_text(s)

          p=Path('src/Mahjong/Table.php')
          s=p.read_text()
          pattern=r"    /\*\* @return array<string,mixed>\|null \*/\n    private function winResult\(int \$seat,int \$tile,bool \$tsumo,bool \$chankan=false\):\?array\n    \{.*?\n    \}\n\n    /\*\* @param list<int> \$winners \*/"
          repl="""    /** @return array<string,mixed>|null */
              private function winResult(int $seat,int $tile,bool $tsumo,bool $chankan=false):?array
              {
                  $hand=$this->s['hands'][$seat];if(!$tsumo)$hand[]=$tile;if(count($hand)%3!==2)return null;if(!$tsumo&&(!empty($this->s['furiten'][$seat])||!empty($this->s['temp_furiten'][$seat])))return null;
                  $haitei=$tsumo&&empty($this->s['wall'])&&!$this->s['last_draw_rinshan'];$houtei=!$tsumo&&empty($this->s['wall'])&&!$chankan;$tenho=$tsumo&&$seat===$this->oya()&&(int)$this->s['discard_count']===0&&!$this->s['any_call'];$chiho=$tsumo&&$seat!==$this->oya()&&count($this->s['discards'][$seat])===0&&!$this->s['any_call']&&(int)$this->s['discard_count']<(int)$this->s['seats'];$extra=SituationalYaku::evaluate($haitei,$houtei,$tsumo&&!empty($this->s['last_draw_rinshan']),$chankan,$tenho,$chiho);$allowNoYaku=(int)$extra['han']>0||(int)$extra['yakuman']>0;
                  $base=HandEvaluator::evaluate($hand,$this->s['melds'][$seat],$tile,$tsumo,$this->seatWind($seat),$this->ba(),!empty($this->s['riichi'][$seat]),!empty($this->s['double_riichi'][$seat]),!empty($this->s['ippatsu'][$seat]),array_slice($this->s['dora_ind'],0,(int)$this->s['dora_open']),array_slice($this->s['ura_ind'],0,(int)$this->s['dora_open']),(int)$this->s['taku'],$allowNoYaku);if($base===null)return null;return SituationalYaku::merge($base,$extra);
              }

              /** @param list<int> $winners */"""
          ns,n=re.subn(pattern,repl,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'Table winResult replacement count={n}')
          p.write_text(ns)

          p=Path('tests/chankan_test.php')
          s=p.read_text()
          old="$s['hands'][1]=[1,2,3,10,11,12,19,20,21,4,4,5,5];"
          new="$s['hands'][1]=[0,1,2,12,13,14,24,25,26,27,27,3,4];"
          if old not in s:
              raise SystemExit('chankan hand anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('// tile with a tanyao hand, so it must rob the added kan before rinshan draw.','// tile with no ordinary yaku. Chankan alone must make the ron legal before rinshan draw.',1)
          p.write_text(s)
          PY
      - name: Verify focused tests
        run: |
          php -l src/Mahjong/HandEvaluator.php
          php -l src/Mahjong/Table.php
          php tests/hand_evaluator_test.php
          php tests/chankan_test.php
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Mahjong/HandEvaluator.php src/Mahjong/Table.php tests/chankan_test.php
          git commit -m 'Allow situational-only winning hands'
          git push
